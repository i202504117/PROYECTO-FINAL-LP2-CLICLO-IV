<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agregar evidencia - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><h1 class="page-title">Agregar evidencia</h1><p class="page-subtitle">Adjunta una imagen relacionada con el diagnóstico.</p><section class="panel"><div class="detail-item"><span class="detail-label">Atención</span><strong th:text="${atencion.codigoSeguimiento}"></strong></div><form th:action="@{/atenciones/{id}/evidencias/guardar(id=${atencion.id})}" method="post" enctype="multipart/form-data"><div class="form-grid"><div class="form-group full"><label for="archivo">Imagen</label><input type="file" id="archivo" name="archivo" accept=".jpg,.jpeg,.png" required></div><div class="form-group full"><label for="descripcion">Descripción</label><textarea id="descripcion" name="descripcion" placeholder="Describe lo que muestra la imagen" required></textarea></div><div class="form-group full"><label><input type="checkbox" name="final" value="true"> Esta es la evidencia final: finalizar atención y dejar equipo listo para recojo</label></div></div><div class="actions"><button class="btn btn-primary" type="submit">Guardar evidencia</button><a class="btn btn-secondary" th:href="@{/atenciones/detalle/{id}(id=${atencion.id})}">Cancelar</a></div></form></section></main></div>
</body></html>
