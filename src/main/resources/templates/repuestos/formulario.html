<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar repuesto - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><h1 class="page-title">Registrar repuesto utilizado</h1><p class="page-subtitle">El stock se descontará automáticamente al guardar.</p><section class="panel"><div class="detail-grid"><div class="detail-item"><span class="detail-label">Atención</span><strong th:text="${atencion.codigoSeguimiento}"></strong></div><div class="detail-item"><span class="detail-label">Equipo</span><strong th:text="${atencion.tipoEquipo + ' - ' + atencion.marca + ' ' + atencion.modelo}"></strong></div><div class="detail-item"><span class="detail-label">Estado</span><span class="badge" th:text="${atencion.estado.descripcion}"></span></div></div><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><form th:action="@{/atenciones/{id}/repuestos/guardar(id=${atencion.id})}" method="post"><div class="form-grid"><div class="form-group"><label for="productoId">Repuesto</label><select id="productoId" name="productoId" required><option value="">Seleccione un repuesto</option><option th:each="repuesto : ${repuestos}" th:value="${repuesto.id}" th:text="${repuesto.codigo + ' - ' + repuesto.nombre + ' | Stock: ' + repuesto.stockActual + ' | Precio: S/ ' + repuesto.precioVenta}"></option></select></div><div class="form-group"><label for="cantidad">Cantidad utilizada</label><input id="cantidad" type="number" name="cantidad" min="1" required></div></div><div class="actions"><button class="btn btn-warning" type="submit">Registrar y descontar stock</button><a class="btn btn-secondary" th:href="@{/atenciones/detalle/{id}(id=${atencion.id})}">Cancelar</a></div></form></section></main></div>
</body></html>
