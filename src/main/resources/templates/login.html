<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | Mundo Tecnológico y Electrónico</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-page">

    <main class="login-wrapper">

        <section class="login-card">

            <div class="login-brand">
                <div class="login-logo">MTE</div>

                <h1>Mundo Tecnológico</h1>
                <h2>y Electrónico</h2>

                <p>Gestión integral de reparaciones, ventas e inventario</p>
            </div>

            <div th:if="${param.error}" class="login-alert login-alert-error">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="login-alert login-alert-success">
                Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="post" class="login-form">

                <div class="login-field">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        required>
                </div>

                <div class="login-field">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingrese su contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="login-button">
                    Ingresar al sistema
                </button>

            </form>

            <a class="login-public-link" th:href="@{/consulta-atencion}">
                Consultar estado de mi equipo
            </a>

            <footer class="login-footer">
                © 2026 Mundo Tecnológico y Electrónico
            </footer>

        </section>

    </main>

</body>
</html>
