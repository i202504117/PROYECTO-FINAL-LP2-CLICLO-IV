<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar venta - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><h1 class="page-title">Registrar venta</h1><p class="page-subtitle">Registra una venta y confirma luego la salida del inventario.</p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><form th:action="@{/ventas/guardar}" method="post"><div class="form-grid"><div class="form-group"><label for="clienteId">Cliente</label><select id="clienteId" name="clienteId"><option value="">Venta general sin cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombres + ' ' + cliente.apellidos + ' - ' + cliente.telefono}"></option></select></div><div class="form-group"><label for="productoId">Producto</label><select id="productoId" name="productoId" required><option value="">Seleccione un producto</option><option th:each="producto : ${productos}" th:value="${producto.id}" th:attr="data-precio=${producto.precioVenta}" th:text="${producto.codigo + ' - ' + producto.nombre + ' | Stock: ' + producto.stockActual + ' | S/ ' + producto.precioVenta}"></option></select></div><div class="form-group"><label for="cantidad">Cantidad</label><input id="cantidad" type="number" name="cantidad" min="1" required></div><div class="form-group"><label for="precioUnitario">Precio unitario de venta</label><input id="precioUnitario" type="number" name="precioUnitario" min="0" step="0.01" required></div><div class="form-group"><label for="metodoPago">Método de pago</label><select id="metodoPago" name="metodoPago" required><option value="">Seleccione un método</option><option value="EFECTIVO">Efectivo</option><option value="YAPE">Yape</option><option value="PLIN">Plin</option><option value="TARJETA">Tarjeta</option><option value="TRANSFERENCIA">Transferencia</option></select></div></div><div class="actions"><button class="btn btn-success" type="submit">Registrar venta</button><a class="btn btn-secondary" th:href="@{/ventas}">Cancelar</a></div></form></section></main></div><script>
const productoSelect=document.getElementById('productoId'); const precio=document.getElementById('precioUnitario');
productoSelect.addEventListener('change',()=>{const op=productoSelect.options[productoSelect.selectedIndex]; precio.value=op.dataset.precio||'';});
</script>
</body></html>
