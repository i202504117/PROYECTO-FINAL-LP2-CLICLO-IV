<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ventas - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Ventas</h1><p class="page-subtitle">Registra ventas y controla las salidas de inventario.</p></div><a class="btn btn-success" th:href="@{/ventas/nueva}">+ Registrar venta</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div th:if="${#lists.isEmpty(ventas)}" class="empty-state"><h3>No hay ventas registradas</h3><a class="btn btn-success" th:href="@{/ventas/nueva}">Registrar venta</a></div><div th:if="${not #lists.isEmpty(ventas)}" class="table-container"><table><thead><tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="venta : ${ventas}"><td><strong th:text="${venta.numeroVenta}"></strong></td><td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></td><td><span th:if="${venta.cliente != null}" th:text="${venta.cliente.nombres + ' ' + venta.cliente.apellidos}"></span><span th:if="${venta.cliente == null}" class="muted">Venta general</span></td><td>S/ <span th:text="${venta.total}"></span></td><td th:text="${venta.metodoPago}"></td><td><span class="badge" th:text="${venta.estado}"></span></td><td><a class="btn btn-primary btn-small" th:href="@{/ventas/{id}(id=${venta.id})}">Ver detalle</a></td></tr></tbody></table></div></section></main></div>
</body></html>
