<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compras - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Compras</h1><p class="page-subtitle">Controla las entradas de inventario por proveedor.</p></div><a class="btn btn-warning" th:href="@{/compras/nueva}">+ Registrar compra</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div th:if="${#lists.isEmpty(compras)}" class="empty-state"><h3>No hay compras registradas</h3><a class="btn btn-warning" th:href="@{/compras/nueva}">Registrar compra</a></div><div th:if="${not #lists.isEmpty(compras)}" class="table-container"><table><thead><tr><th>Número</th><th>Proveedor</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="compra : ${compras}"><td><strong th:text="${compra.numeroCompra}"></strong></td><td th:text="${compra.proveedor.razonSocial}"></td><td th:text="${#temporals.format(compra.fechaCompra, 'dd/MM/yyyy HH:mm')}"></td><td>S/ <span th:text="${compra.total}"></span></td><td><span class="badge" th:text="${compra.estado}"></span></td><td><a class="btn btn-primary btn-small" th:href="@{/compras/{id}(id=${compra.id})}">Ver detalle</a></td></tr></tbody></table></div></section></main></div>
</body></html>
