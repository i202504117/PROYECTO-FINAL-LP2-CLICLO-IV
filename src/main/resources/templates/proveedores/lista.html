<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Proveedores</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div></header><div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Proveedores</h1></div><a class="btn btn-primary" th:href="@{/proveedores/nuevo}">+ Nuevo</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div class="table-container"><table><thead><tr><th>Razón social</th><th>RUC</th><th>Teléfono</th><th>Correo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${proveedores}"><td th:text="${item.razonSocial}"></td><td th:text="${item.ruc}"></td><td th:text="${item.telefono}"></td><td th:text="${item.email}"></td><td th:text="${item.estado ? 'Activo' : 'Inactivo'}"></td><td><a class="btn btn-primary btn-small" th:href="@{/proveedores/editar/{id}(id=${item.id})}">Editar</a><form th:action="@{/proveedores/eliminar/{id}(id=${item.id})}" method="post" style="display:inline"><button class="btn btn-danger btn-small" type="submit" onclick="return confirm('Esta acción eliminará definitivamente el proveedor. Solo se podrá realizar si no tiene productos ni compras. ¿Continuar?')">Eliminar definitivamente</button></form><form th:if="${!item.estado}" th:action="@{/proveedores/activar/{id}(id=${item.id})}" method="post" style="display:inline"><button class="btn btn-success btn-small" type="submit">Activar</button></form></td></tr></tbody></table></div></section></main></div></body></html>
