<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar usuario - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><h1 class="page-title">Registrar usuario</h1><p class="page-subtitle">Crea un administrador o técnico con acceso controlado.</p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post"><div class="form-grid"><div class="form-group"><label for="nombres">Nombres</label><input id="nombres" type="text" th:field="*{nombres}" required></div><div class="form-group"><label for="apellidos">Apellidos</label><input id="apellidos" type="text" th:field="*{apellidos}" required></div><div class="form-group"><label for="username">Usuario</label><input id="username" type="text" th:field="*{username}" required></div><div class="form-group"><label for="password">Contraseña</label><input id="password" type="password" th:field="*{password}" required></div><div class="form-group"><label for="rol">Rol</label><select id="rol" th:field="*{rol}" required><option value="">Seleccione un rol</option><option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option></select></div><div class="form-group"><label for="especialidad">Especialidad</label><input id="especialidad" type="text" th:field="*{especialidad}"></div><div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" type="tel" th:field="*{telefono}"></div><div class="form-group"><label for="email">Correo</label><input id="email" type="email" th:field="*{email}"></div></div><div class="actions"><button class="btn btn-primary" type="submit">Guardar usuario</button><a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a></div></form></section></main></div>
</body></html>
