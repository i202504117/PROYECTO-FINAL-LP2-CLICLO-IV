<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Usuarios - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Usuarios del sistema</h1><p class="page-subtitle">Administra accesos, roles y estados de usuario.</p></div><a class="btn btn-primary" th:href="@{/usuarios/nuevo}">+ Registrar usuario</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div th:if="${#lists.isEmpty(usuarios)}" class="empty-state"><h3>No hay usuarios registrados</h3></div><div th:if="${not #lists.isEmpty(usuarios)}" class="table-container"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="usuario : ${usuarios}"><td><strong th:text="${usuario.nombres + ' ' + usuario.apellidos}"></strong><small class="table-secondary" th:text="${usuario.email}"></small></td><td th:text="${usuario.username}"></td><td><span class="badge" th:text="${usuario.rol}"></span></td><td><span class="badge" th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></span></td><td><a th:if="${usuario.estado}" class="btn btn-danger btn-small" th:href="@{/usuarios/desactivar/{id}(id=${usuario.id})}" onclick="return confirm('¿Desactivar este usuario?');">Desactivar</a><a th:if="${!usuario.estado}" class="btn btn-success btn-small" th:href="@{/usuarios/activar/{id}(id=${usuario.id})}">Activar</a></td></tr></tbody></table></div></section></main></div>
</body></html>
