<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Atenciones - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Atenciones técnicas</h1><p class="page-subtitle">Seguimiento de equipos recibidos para diagnóstico y reparación.</p></div><a class="btn btn-primary" th:href="@{/atenciones/nuevo}">+ Nueva atención</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div th:if="${#lists.isEmpty(atenciones)}" class="empty-state"><h3>No hay atenciones registradas</h3><a class="btn btn-primary" th:href="@{/atenciones/nuevo}">Registrar atención</a></div><div th:if="${not #lists.isEmpty(atenciones)}" class="table-container"><table><thead><tr><th>Código</th><th>Cliente</th><th>Equipo</th><th>Falla reportada</th><th>Estado</th><th>Técnico</th><th>Registro</th><th>Acciones</th></tr></thead><tbody><tr th:each="atencion : ${atenciones}"><td><strong th:text="${atencion.codigoSeguimiento}"></strong></td><td th:text="${atencion.cliente.nombres + ' ' + atencion.cliente.apellidos}"></td><td th:text="${atencion.tipoEquipo + ' ' + atencion.marca + ' ' + atencion.modelo}"></td><td th:text="${atencion.fallaReportada}"></td><td><span class="badge" th:text="${atencion.estado.descripcion}"></span></td><td th:text="${atencion.tecnicoAsignado != null ? atencion.tecnicoAsignado.nombres + ' ' + atencion.tecnicoAsignado.apellidos : 'Sin asignar'}"></td><td th:text="${#temporals.format(atencion.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td><td><a class="btn btn-primary btn-small" th:href="@{/atenciones/detalle/{id}(id=${atencion.id})}">Ver detalle</a> <form sec:authorize="hasRole('ADMINISTRADOR')" th:action="@{/atenciones/eliminar/{id}(id=${atencion.id})}" method="post" style="display:inline"><button class="btn btn-danger btn-small" type="submit" onclick="return confirm('Esta acción eliminará la atención, evidencias e historial. ¿Continuar?');">Eliminar</button></form></td></tr></tbody></table></div></section></main></div>
</body></html>
