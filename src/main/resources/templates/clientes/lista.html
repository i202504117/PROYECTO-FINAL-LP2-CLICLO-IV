<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Clientes - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><div class="page-heading"><div><h1 class="page-title">Clientes</h1><p class="page-subtitle">Administra la información de tus clientes.</p></div><a class="btn btn-primary" th:href="@{/clientes/nuevo}">+ Registrar cliente</a></div><p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></p><p th:if="${error}" class="alert alert-error" th:text="${error}"></p><section class="panel"><div th:if="${#lists.isEmpty(clientes)}" class="empty-state"><h3>No hay clientes registrados</h3><a class="btn btn-primary" th:href="@{/clientes/nuevo}">Registrar cliente</a></div><div th:if="${not #lists.isEmpty(clientes)}" class="table-container"><table><thead><tr><th>ID</th><th>Cliente</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="cliente : ${clientes}"><td th:text="${cliente.id}"></td><td><strong th:text="${cliente.nombres + ' ' + cliente.apellidos}"></strong></td><td th:text="${cliente.telefono}"></td><td th:text="${cliente.email}"></td><td th:text="${cliente.direccion}"></td><td><span class="badge" th:text="${cliente.estado ? 'Activo' : 'Inactivo'}"></span></td><td><a class="btn btn-primary btn-small" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a> <a th:if="${cliente.estado}" class="btn btn-danger btn-small" th:href="@{/clientes/desactivar/{id}(id=${cliente.id})}" onclick="return confirm('¿Desactivar este cliente?');">Desactivar</a><a th:if="${!cliente.estado}" class="btn btn-success btn-small" th:href="@{/clientes/activar/{id}(id=${cliente.id})}">Activar</a><form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post" style="display:inline"><button class="btn btn-danger btn-small" type="submit" onclick="return confirm('Esta acción eliminará definitivamente el cliente. Solo se podrá realizar si no tiene atenciones ni ventas. ¿Continuar?');">Eliminar definitivamente</button></form></td></tr></tbody></table></div></section></main></div>
</body></html>
