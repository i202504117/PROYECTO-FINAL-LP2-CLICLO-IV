<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registrar cliente - Mundo Tecnológico y Electrónico</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body>
<header class="header"><div class="brand"><div class="brand-mark">M</div><div class="logo">Mundo Tecnológico y Electrónico</div></div><div class="header-user" sec:authorize="isAuthenticated()">Usuario: <strong sec:authentication="name"></strong> &nbsp;|&nbsp; <form th:action="@{/logout}" method="post" class="header-logout-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="header-logout-button">Cerrar sesión</button></form></div></header>
<div class="layout"><div th:replace="~{fragments/menu :: sidebar}"></div><main class="content"><h1 class="page-title">Registrar cliente</h1><p class="page-subtitle">Registra los datos de contacto del cliente.</p><section class="panel"><form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="form-group"><label for="nombres">Nombres</label><input id="nombres" type="text" th:field="*{nombres}" required></div><div class="form-group"><label for="apellidos">Apellidos</label><input id="apellidos" type="text" th:field="*{apellidos}" required></div><div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" type="tel" th:field="*{telefono}" required></div><div class="form-group"><label for="email">Correo electrónico</label><input id="email" type="email" th:field="*{email}"></div><div class="form-group full"><label for="direccion">Dirección</label><input id="direccion" type="text" th:field="*{direccion}"></div></div><div class="actions"><button class="btn btn-primary" type="submit">Guardar cliente</button><a class="btn btn-secondary" th:href="@{/clientes}">Cancelar</a></div></form></section></main></div>
</body></html>
